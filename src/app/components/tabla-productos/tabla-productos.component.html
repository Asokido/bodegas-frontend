<h2>Productos por bodega</h2>

<table>
  <thead>
    <tr>
      <th>Producto</th>
      <th>Precio</th>
      <th>Cantidad</th>
      <th>Bodega</th>
    </tr>
  </thead>
  <tbody>
    @for (fila of filas; track $index) {
      <tr>
        <td>{{ fila.producto }}</td>
        <td>{{ fila.precio | number: '1.0-0' }}</td>
        <td>{{ fila.cantidad }}</td>
        <td>{{ fila.bodega }}</td>
      </tr>
    } @empty {
      <tr>
        <td colspan="4">No hay productos registrados.</td>
      </tr>
    }
  </tbody>
</table>
